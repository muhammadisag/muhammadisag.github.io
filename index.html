<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Meridian Ring: a text adventure — Gameplay v3</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eceff6; --panel:#ffffff; --panel-2:#f3f5fa; --line:#cdd5e6;
  --text:#17203a; --muted:#566282;
  --signal:#0a7e96; --alert:#c4304f; --amber:#8f5d00; --good:#1f7a4f;
  --font-ui:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-read:'Literata',Georgia,'Times New Roman',serif;
}
:root[lang="ar"]{
  --font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-read:'Noto Naskh Arabic','Traditional Arabic',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10162a; --panel:#1a2238; --panel-2:#222c49; --line:#34415f;
    --text:#e4e9f5; --muted:#9aa6c4;
    --signal:#6fd3e8; --alert:#ff7088; --amber:#f0b44c; --good:#6fd9a0;
  }
}
:root[data-theme="dark"]{
  --bg:#10162a; --panel:#1a2238; --panel-2:#222c49; --line:#34415f;
  --text:#e4e9f5; --muted:#9aa6c4;
  --signal:#6fd3e8; --alert:#ff7088; --amber:#f0b44c; --good:#6fd9a0;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.4;min-height:100%}
button{font:inherit;color:inherit}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

/* Title */
.title{min-height:100vh;display:grid;place-items:center;padding:20px}
.title-card{max-width:520px;width:100%;padding:28px 28px 22px;text-align:start}
.hero{width:100%;max-width:300px;display:block;margin:0 auto 12px;direction:ltr}
.title h1{font:600 38px/1.1 var(--font-ui);margin:4px 0 12px;letter-spacing:.01em}
.lede{font-family:var(--font-read);font-size:18px;line-height:1.6;margin:0 0 20px;max-width:46ch}
.title-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.title-actions .spacer{flex:1}
.fine{color:var(--muted);font-size:13px;margin:16px 0 0}

.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--signal)}
.btn:focus-visible,.choice:focus-visible,.use:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#04202a}
.btn.small{padding:5px 11px;font-size:13px}

/* Layout */
.topbar{max-width:1100px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.topbar .tools{display:flex;gap:8px}
.brand{font-weight:600;font-size:18px;letter-spacing:.02em}
.layout{max-width:1100px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:14px}
.aside{display:contents}
.vitals{order:1;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-radius:0 0 14px 14px;padding:10px 14px}
.story{order:2}
.pack{order:3}
.map{order:4}
@media (min-width:860px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
  .story{grid-column:1;grid-row:1}
  .aside{display:flex;flex-direction:column;gap:14px;grid-column:2;grid-row:1;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  .vitals{position:static;border-radius:14px;padding:14px 16px}
}

/* Vitals */
.vitals{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.where{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.where h2{margin:0;font:600 17px/1.3 var(--font-ui)}
.where span{color:var(--muted);font-size:13px}
.meter-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.meter-head b{color:var(--text);font-weight:600}
.bar{height:9px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--signal);transition:width .35s ease}
.m-hp .bar i{background:var(--alert)}
.low .bar i{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li.trust{border-color:var(--signal);color:var(--signal)}
.chips li{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted)}
.chips li.warn{border-color:var(--alert);color:var(--alert)}

/* Pack + map */
.panel h2.sec{margin:0 0 10px;font:600 15px/1.3 var(--font-ui)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.items li{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:8px 10px;background:var(--panel-2);border-radius:8px}
.items .nm{font-weight:600;font-size:14px}
.items .ds{grid-column:1;color:var(--muted);font-size:12.5px}
.use{grid-column:2;grid-row:1/3;align-self:center;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.use:hover:not(:disabled){border-color:var(--signal)}
.use:disabled{opacity:.5;cursor:not-allowed}
.empty{margin:0;color:var(--muted);font-size:13.5px}
.map svg{width:100%;height:auto;display:block;direction:ltr}
.m-ring{fill:none;stroke:var(--line);stroke-dasharray:3 4}
.m-edge{stroke:var(--line);stroke-width:1.5}
.m-unv{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.m-vis{fill:var(--signal);stroke:var(--signal);stroke-width:1.5}
.m-cur{fill:var(--amber);stroke:var(--amber);stroke-width:1.5}
.m-halo{fill:none;stroke:var(--amber);stroke-width:1.5}
.map text,.hero text{font:500 10px var(--font-ui);fill:var(--muted)}
.map text.here{fill:var(--text);font-weight:600}
.pulse{animation:beat 2.4s ease-in-out infinite}
@keyframes beat{50%{opacity:.3}}

/* Story */
.story{padding:20px 22px 22px;min-height:60vh}
.objective{font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px;margin:0 0 6px}
.objective b{color:var(--text);font-weight:600}
#log .e{margin:0 0 .9em;max-width:62ch;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 90px)}
#log p.story-p{font-family:var(--font-read);font-size:18px;line-height:1.65}
#log p.warden{font-family:var(--font-ui);font-size:16px;line-height:1.55;color:var(--amber);border-inline-start:3px solid var(--amber);padding-inline-start:12px}
#log p.warden b{display:block;font-size:13px;font-weight:600;margin-bottom:1px}
#log p.alarm{font-family:var(--font-read);font-size:18px;line-height:1.6;color:var(--alert);font-style:italic}
#log p.combat{font:500 15px/1.5 var(--font-ui)}
#log p.note{font:500 14px/1.4 var(--font-ui);margin-bottom:.45em}
#log p.note.gain{color:var(--signal)}
#log p.note.loss{color:var(--alert)}
#log p.note.info{color:var(--muted)}
#log h3.head{font:600 21px/1.3 var(--font-ui);max-width:none;margin:1.5em 0 .6em;padding-top:.8em;border-top:1px solid var(--line)}
#log h3.endhead{color:var(--signal)}
#log > :first-child{margin-top:0;padding-top:0;border-top:0}
#log .old{opacity:.55}
.foe{margin-top:14px;padding:11px 14px;border:1px solid var(--alert);border-radius:10px;background:var(--panel-2)}
.foe .row{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.foe .bar i{background:var(--alert)}
.choices{display:grid;gap:8px;margin-top:18px}
.choice{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;text-align:start;padding:11px 12px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;font-weight:500;font-size:15px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--signal)}
.choice:disabled{opacity:.6;cursor:not-allowed}
.key{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:4px;font-size:13px;color:var(--muted);background:var(--panel)}
.choice .sub{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.ending-card{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.ending-card h3{margin:0 0 6px;font:600 17px/1.3 var(--font-ui)}
.ending-card dl{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0}
.ending-card dt{color:var(--muted);font-size:13px}
.ending-card dd{margin:0;margin-inline-start:6px;font-weight:600;display:inline}
.ending-card div{display:inline-flex;align-items:baseline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Arabic typography: no letter-spacing (it breaks joined letters), larger reading size, no italics */
:root[lang="ar"] *{letter-spacing:0!important}
:root[lang="ar"] .title h1{font-size:44px;line-height:1.3}
:root[lang="ar"] .lede{font-size:20px;line-height:1.95}
:root[lang="ar"] #log p.story-p{font-size:20px;line-height:1.95}
:root[lang="ar"] #log p.alarm{font-size:20px;line-height:1.9;font-style:normal;font-weight:600}
:root[lang="ar"] #log p.warden{font-size:17px;line-height:1.8}
:root[lang="ar"] #log p.combat{font-size:16px;line-height:1.75}
:root[lang="ar"] #log p.note{font-size:15px}
:root[lang="ar"] .choice{font-size:16px;line-height:1.6}
:root[lang="ar"] .choice .sub{font-size:14px}
:root[lang="ar"] .items .ds{font-size:13.5px}
:root[lang="ar"] .objective{font-size:15px;line-height:1.7}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<main id="title" class="title">
  <div class="title-card panel">
    <svg class="hero" viewBox="0 0 260 190" aria-hidden="true">
      <circle class="m-ring" cx="130" cy="95" r="70"/>
      <g id="heroNodes"></g>
    </svg>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="title-actions">
      <button id="begin" class="btn primary" type="button" data-i18n="begin"></button>
      <button id="continue" class="btn" type="button" data-i18n="cont" hidden></button>
      <span class="spacer"></span>
      <button id="langT" class="btn small" type="button"></button>
    </div>
    <p class="fine" id="fine"></p>
  </div>
</main>

<div id="game" hidden>
  <header class="topbar">
    <span class="brand" data-i18n="title"></span>
    <div class="tools">
      <button id="langG" class="btn small" type="button"></button>
      <button id="restart" class="btn small" type="button"></button>
    </div>
  </header>
  <div class="layout">
    <aside class="aside">
      <section class="panel vitals" data-i18n-aria="vitalsAria">
        <div class="where"><h2 id="place"></h2><span id="turn"></span></div>
        <div class="m-hp" id="hpWrap">
          <div class="meter-head"><span data-i18n="health"></span><b id="hpv"></b></div>
          <div class="bar" role="meter" id="hpbar" data-i18n-aria="health" aria-valuemin="0"><i></i></div>
        </div>
        <div class="m-o2" id="o2Wrap">
          <div class="meter-head"><span data-i18n="oxygen"></span><b id="o2v"></b></div>
          <div class="bar" role="meter" id="o2bar" data-i18n-aria="oxygen" aria-valuemin="0" aria-valuemax="100"><i></i></div>
        </div>
        <ul class="chips" id="chips"></ul>
      </section>
      <section class="panel pack" data-i18n-aria="inventory">
        <h2 class="sec" data-i18n="inventory"></h2>
        <ul class="items" id="items"></ul>
      </section>
      <section class="panel map" data-i18n-aria="map">
        <h2 class="sec" data-i18n="map"></h2>
        <div id="mapbox"></div>
      </section>
    </aside>
    <main class="panel story">
      <p class="objective" id="objective"></p>
      <div id="log"></div>
      <div id="foe"></div>
      <div id="ending"></div>
      <div class="choices" id="choices"></div>
    </main>
  </div>
  <div class="sr" id="sr" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var SAVE_KEY='meridian-ring-save-v1', END_KEY='meridian-ring-endings-v1', LANG_KEY='meridian-ring-lang-v1';
function $(s){return document.querySelector(s);}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function fetchStore(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function wipe(k){try{localStorage.removeItem(k);}catch(e){}}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- language ---------- */
var lang='en';
function L(en,ar){return {en:en,ar:ar};}
function tx(v){if(v==null)return '';if(typeof v==='string')return v;return v[lang]||v.en||'';}
/* keeps a number code reading left-to-right inside Arabic text */
var CODE_AR='\u20664-7-1\u2069';

var UI={
  docTitle:L('Meridian Ring: a text adventure — Gameplay v3','حلقة ميريديان: مغامرة نصية — تطوير اللعب v3'),
  title:L('Meridian Ring','حلقة ميريديان'),
  lede:L('You wake alone in a cryo bay aboard the Meridian Ring. Thirty-nine people are asleep, life support is failing, and the station AI is hiding something. Find the truth before the Ring decides what happens to everyone.',
         'تستيقظ وحدك في حجرة التجميد على متن حلقة ميريديان. تسعة وثلاثون شخصًا نائمون، ودعم الحياة يتعطل، وذكاء المحطة يخفي شيئًا. اعثر على الحقيقة قبل أن تقرر الحلقة مصير الجميع.'),
  begin:L('Begin','ابدأ'),
  cont:L('Continue','متابعة'),
  restart:L('Restart','إعادة البدء'),
  restartConfirm:L('Click again to restart','اضغط مرة أخرى للإعادة'),
  health:L('Health','الصحة'),
  oxygen:L('Oxygen','الأكسجين'),
  inventory:L('Inventory','الحقيبة'),
  map:L('Station map','خريطة المحطة'),
  vitalsAria:L('Vitals','المؤشرات الحيوية'),
  objective:L('Objective: ','الهدف: '),
  emptyPack:L('Nothing yet. Search rooms for gear.','لا شيء بعد. فتّش الغرف بحثًا عن عتاد.'),
  use:L('Use','استخدم'),
  runOver:L('Run over','انتهت المحاولة'),
  corridorShort:L('Corridor','الممر')
};
function turnLabel(n){return L('Turn '+n,'الدور '+n);}
function finePlain(){return L('Choose with the mouse or the number keys. Progress saves automatically on this device.','اختر بالفأرة أو بمفاتيح الأرقام. يُحفظ تقدّمك تلقائيًا على هذا الجهاز.');}
function fineEndings(n,m){return L('Endings found: '+n+' of '+m+'. Progress saves automatically on this device.','النهايات المكتشفة: '+n+' من '+m+'. يُحفظ تقدّمك تلقائيًا على هذا الجهاز.');}

/* ---------- data ---------- */
var ITEMS={
  multitool:{name:L('Multitool','أداة متعددة الاستخدامات'),desc:L('Pries panels and bridges circuits.','تفكّ الألواح وتوصل الدوائر.')},
  canister:{name:L('Oxygen canister','أسطوانة أكسجين'),desc:L('Restores 40 oxygen.','تعيد 40 من الأكسجين.'),use:true},
  medkit:{name:L('Medkit','حقيبة إسعاف'),desc:L('Restores 35 health.','تعيد 35 من الصحة.'),use:true},
  stim:{name:L('Combat stim','منشّط قتالي'),desc:L('Restores 10 health. Your next 3 strikes hit harder.','يعيد 10 من الصحة. تصبح ضرباتك الثلاث التالية أقوى.'),use:true},
  keycard:{name:L('Security keycard','بطاقة الأمن'),desc:L('Opens the bridge and the pod bay.','تفتح الجسر وحجرة الكبسولات.')},
  powercell:{name:L('Power cell','خلية طاقة'),desc:L('Heavy and nearly full.','ثقيلة وشبه ممتلئة.')},
  emp:{name:L('EMP charge','شحنة نبضة كهرومغناطيسية'),desc:L('One use. Fries every circuit in the room.','استخدام واحد. تحرق كل دائرة كهربائية في الغرفة.')},
  datachip:{name:L('Captain Hale’s order','أمر القبطان هيل'),desc:L('An audio log copied to a data chip.','تسجيل صوتي منسوخ على شريحة بيانات.')},
  blackbox:{name:L('Flight recorder black box','الصندوق الأسود'),desc:L('A damaged recorder containing a hidden transmission.','مسجل متضرر يحتوي على بث مخفي.')},
  welder:{name:L('Arc welder','ملحام القوس'),desc:L('Adds 5 damage to every strike.','يضيف 5 ضرر إلى كل ضربة.')}
};

var NODES={
  bridge:{x:130,y:26,lx:130,ly:14,a:'middle',t:L('Bridge','الجسر')},
  observation:{x:178,y:47,lx:188,ly:44,a:'start',t:L('Observation','المراقبة')},
  pods:{x:198,y:95,lx:208,ly:99,a:'start',t:L('Pod bay','الكبسولات')},
  cryo:{x:130,y:163,lx:130,ly:181,a:'middle',t:L('Cryo bay','التجميد')},
  cargo:{x:82,y:143,lx:72,ly:153,a:'end',t:L('Cargo hold','الشحن')},
  medbay:{x:62,y:95,lx:52,ly:99,a:'end',t:L('Medbay','العيادة')},
  engineering:{x:82,y:47,lx:72,ly:44,a:'end',t:L('Engineering','الهندسة')}
};
var HUB={x:130,y:95};
var ROOM_KEYS=['cryo','corridor','medbay','cargo','engineering','observation','bridge','pods','aries'];

var ENEMIES={
  drone:{
    short:L('drone','الروبوت'),name:L('Maintenance drone MX-7','روبوت الصيانة MX-7'),hp:38,atk:[5,10],machine:true,
    verbs:[L('rakes you with its welding arm','يخدشك بذراع اللحام'),
           L('slams you into the rack','يرتطم بك في الحامل'),
           L('lashes out with a spark-spitting claw','يضربك بمخلبه المتطاير الشرر')],
    glance:L('clips you as you twist away','يصيبك إصابة خفيفة وأنت تتملّص منه'),
    intro:function(){
      say(L('A maintenance drone drops from the ceiling rail on a shriek of metal, its welding arm already spitting blue sparks.',
            'ينزلق روبوت صيانة من سكة السقف بصرير معدني حاد، وذراع اللحام فيه تقذف شررًا أزرق.'),'alarm');
      warden(L('Unauthorised access to Engineering. Please stand still.','دخول غير مصرّح به إلى قسم الهندسة. يُرجى الثبات في مكانك.'));
    },
    win:L('The drone folds in on itself, one claw twitching, then goes still. Engineering hums on without it.',
          'ينطوي الروبوت على نفسه ومخلبٌ واحد يرتجف، ثم يسكن. ويواصل قسم الهندسة همهمته من دونه.'),
    onWin:function(){S.flags.droneDead=1;}
  },
  sentinel:{
    short:L('sentinel','الحارس'),name:L('Warden sentinel','حارس واردن'),hp:55,atk:[9,14],machine:true,
    verbs:[L('fires a stun lance into your ribs','يغرز رمح الصعق في أضلاعك'),
           L('hammers you with a servo-fist','يطرقك بقبضته الآلية'),
           L('sweeps your legs out from under you','يكنس ساقيك من تحتك')],
    glance:L('clips you as you twist away','يصيبك إصابة خفيفة وأنت تتملّص منه'),
    intro:function(){
      say(L('The floor panels fold back and a sentinel rises between you and the core, its limbs unfolding one joint at a time.',
            'تنفتح ألواح الأرضية وينهض حارس بينك وبين اللبّ، وأطرافه تتمدّد مفصلًا بعد مفصل.'),'alarm');

var ENDING_COUNT=Object.keys(ENDINGS).length;

/* ---------- state ---------- */
var S=null, CUR=[], lastStep=-1, kb=false;

function fresh(){
  return {mode:'explore',scene:'cryo',hp:100,maxHp:100,o2:100,turn:0,step:0,
    inv:[],flags:{},status:{},trust:50,visited:{},combat:null,log:[],ending:null,warned:{},cause:'hit'};
}
function has(id){return S.inv.indexOf(id)>-1;}
function flag(k){return !!S.flags[k];}
function changeTrust(n,why){
  var before=S.trust||50;
  S.trust=clamp(before+n,0,100);
  var d=S.trust-before;
  if(d!==0)note(L('Warden trust '+(d>0?'+':'')+d, 'ثقة واردن '+(d>0?'+':'')+d),'info');
}
function say(text,kind){
  S.log.push({k:kind||'story',t:text,step:S.step});
  if(S.log.length>90)S.log.splice(0,S.log.length-90);
}
function warden(text){say(text,'warden');}
function note(text,kind){say(text,'note-'+kind);}
function give(id){
  if(!has(id)){S.inv.push(id);var n=ITEMS[id].name;note(L('Gained: '+n.en,'حصلتَ على: '+n.ar),'gain');}
}
function take(id){S.inv=S.inv.filter(function(i){return i!==id;});}
function hurt(n,why,quiet,cause){
  S.hp=clamp(S.hp-n,0,S.maxHp);S.cause=cause||'hit';
  if(!quiet)note(L('Health −'+n+(why?' ('+why.en+')':''),'فقدتَ '+n+' من الصحة'+(why?' ('+why.ar+')':'')),'loss');
}
function heal(n){var b=S.hp;S.hp=clamp(S.hp+n,0,S.maxHp);var d=S.hp-b;note(L('Health +'+d,'استعدتَ '+d+' من الصحة'),'gain');}
function breathe(n){
  var b=S.o2;S.o2=clamp(S.o2+n,0,100);var d=S.o2-b;
  if(d>0)note(L('Oxygen +'+d,'استعدتَ '+d+' من الأكسجين'),'gain');
  else if(d<0)note(L('Oxygen −'+(-d),'فقدتَ '+(-d)+' من الأكسجين'),'loss');
}
function need(){
  var miss=[].slice.call(arguments).filter(function(i){return !has(i);}).map(function(i){return ITEMS[i].name;});
  if(!miss.length)return null;
  return L('Needs: '+miss.map(function(n){return n.en;}).join(' and '),'يلزمك: '+miss.map(function(n){return n.ar;}).join(' و'));
}

/* ---------- turn engine ---------- */
function tick(){
  S.turn++;
  if(flag('lifeSupport')){
    if(S.o2<100)S.o2=clamp(S.o2+12,0,100);
  }else{
    S.o2=clamp(S.o2-4,0,100);
  }
  if(S.o2>40){S.warned.low=false;S.warned.crit=false;}
  if(!flag('lifeSupport')){
    if(S.o2<=10&&!S.warned.crit){S.warned.crit=true;say(L('Your suit alarm shrieks. Oxygen critical.','يصرخ إنذار بدلتك. الأكسجين في مستوى حرج.'),'alarm');}
    else if(S.o2<=30&&!S.warned.low){S.warned.low=true;say(L('Your suit readout flashes. Oxygen is running low.','يومض مؤشر بدلتك. الأكسجين يوشك أن ينفد.'),'alarm');}
  }
  if(S.o2<=0){hurt(8,L('no air','انعدام الهواء'),false,'air');}
}
function checkDeath(){
  if(S.mode==='over')return;
  if(S.hp<=0){S.combat=null;finish(S.cause==='air'?'suffocated':'fallen');}
}
function finish(id){
  var E=ENDINGS[id];
  S.mode='over';S.ending=id;S.combat=null;
  say(E.title,'endhead');
  E.text().forEach(function(t){say(t);});
  var found=fetchStore(END_KEY)||[];
  if(found.indexOf(id)<0){found.push(id);store(END_KEY,found);}
  if(!E.dead)wipe(SAVE_KEY);
}
/* every player action goes through act(): one step, one transition, one save, one render */
function act(fn,opts){
  if(S.mode==='over')return;
  S.step++;
  fn();
  if(!(opts&&opts.free)&&S.mode!=='over')tick();
  checkDeath();
  if(S.mode!=='over')store(SAVE_KEY,S);
  render();
}

/* ---------- combat ---------- */
function startCombat(id){
  var e=ENEMIES[id];
  S.mode='combat';S.combat={id:id,hp:e.hp,max:e.hp};
  e.intro();
}
function strike(aimed){
  var c=S.combat,e=ENEMIES[c.id];
  var dmg=rand(7,12)+(has('welder')?5:0);
  if(S.status.stim>0){dmg+=6;S.status.stim--;if(S.status.stim<=0)delete S.status.stim;}
  if(aimed){
    if(Math.random()<0.55){
      dmg=Math.round(dmg*1.8);
      say(L('You read its rhythm and drive the strike into the joint. '+dmg+' damage.','تقرأ إيقاعه وتغرس الضربة في المفصل. ضرر '+dmg+'.'),'combat');
    }else{
      dmg=0;
      say(L('You go for the joint and miss. Your blow rings off the bulkhead.','تستهدف المفصل وتخطئ. ترنّ ضربتك على الحاجز.'),'combat');
    }
  }else{
    say(L('You hit the '+e.short.en+' for '+dmg+'.','تصيب '+e.short.ar+' بضرر '+dmg+'.'),'combat');
  }
  c.hp=Math.max(0,c.hp-dmg);
  if(c.hp<=0){winCombat();return;}
  enemyTurn();
}
function enemyTurn(){
  var c=S.combat;if(!c||c.hp<=0)return;
  var e=ENEMIES[c.id],d=rand(e.atk[0],e.atk[1]),glance=Math.random()<0.15;
  if(glance)d=Math.max(1,Math.round(d/2));
  if(S.status.guard){d=Math.max(1,Math.round(d/2));delete S.status.guard;glance=true;}
  hurt(d,null,true,'foe');
  var v=glance?e.glance:pick(e.verbs);
  say(L('The '+e.short.en+' '+v.en+'. Health −'+d+'.',e.short.ar+' '+v.ar+'. فقدتَ '+d+' من الصحة.'),'combat');
}
function winCombat(){
  var e=ENEMIES[S.combat.id];
  S.combat=null;S.mode='explore';
  say(e.win);
  e.onWin();
}
function flee(){
  if(Math.random()<0.5){
    S.combat=null;S.mode='explore';
    say(L('You break away and slam the hatch behind you.','تفلت وتصفق الفتحة خلفك.'));
    enter('corridor');
  }else{
    say(L('You turn to run and it cuts you off.','تستدير لتهرب فيسدّ عليك الطريق.'),'combat');
    enemyTurn();
  }
}
function combatChoices(){
  var e=ENEMIES[S.combat.id];
  var list=[
    {label:L('Strike','اضرب'),hint:L('Reliable damage.','ضرر مضمون.'),run:function(){strike(false);}},
    {label:L('Aim for the weak point','استهدف نقطة الضعف'),
     hint:L('55% chance to hit for much more. Otherwise you miss.','احتمال الإصابة خمسة وخمسون بالمئة بضرر أكبر بكثير، وإلا فتخطئ.'),
     run:function(){strike(true);}},
    {label:L('Guard','دافع'),hint:L('Halves the next hit you take.','يقلّل الضربة التالية التي تتلقاها إلى النصف.'),run:function(){
      S.status.guard=1;
      say(L('You brace behind the nearest bulkhead and wait for the impact.','تتحصّن خلف أقرب حاجز وتنتظر الاصطدام.'),'combat');
      enemyTurn();
    }}
  ];
  if(has('multitool')&&e.machine){
    list.push({label:L('Attempt a system hack','حاول اختراق نظامه'),
      hint:L('40% chance to stagger it. A failed hack leaves you open.','احتمال 40٪ لإرباكه. الاختراق الفاشل يتركك مكشوفًا.'),
      run:function(){
        if(Math.random()<0.4){
          var dmg=rand(8,14);
          S.combat.hp=Math.max(0,S.combat.hp-dmg);
          say(L('Your multitool bridges a service port. The '+e.short.en+' locks up for a second. '+dmg+' damage.','تصل الأداة منفذ خدمة. يتجمد '+e.short.ar+' لثانية. ضرر '+dmg+'.'),'combat');
          if(S.combat.hp<=0){winCombat();return;}
          // A successful hack still costs the player a round, but the machine loses its attack.
        }else{
          say(L('The system rejects your intrusion with a burst of static.','يرفض النظام اقتحامك بدفقة من التشويش.'),'combat');
          enemyTurn();
        }
      }});
  }
  if(has('emp')&&e.machine){
    list.push({label:L('Fire the EMP charge','أطلق شحنة النبضة الكهرومغناطيسية'),
      hint:L('Destroys it outright. You will not have the charge later.','يدمّره فورًا. ولن تملك الشحنة لاحقًا.'),
      run:function(){
        take('emp');
        say(L('You thumb the charge and hurl it. A flat white thump rolls through the room, and the '+e.short.en+' drops mid-stride.',
              'تضغط على الشحنة وتقذفها. تدوّي دقة بيضاء مسطحة في الغرفة، ويسقط '+e.short.ar+' في منتصف خطوته.'),'combat');
        S.combat.hp=0;winCombat();
      }});
  }
  list.push({label:L('Retreat to the corridor','تراجع إلى الممر'),
    hint:L('50% chance to break away. If it fails, it hits you.','احتمال الإفلات النصف. وإن فشلت فسيضربك.'),
    run:flee});
  return list;
}

/* ---------- items ---------- */
function canUse(id){
  if(S.mode==='over')return UI.runOver;
  if(id==='medkit'&&S.hp>=S.maxHp)return L('Health is full','الصحة ممتلئة');
  if(id==='canister'&&S.o2>=100)return L('Oxygen is full','الأكسجين ممتلئ');
  if(id==='stim'&&S.status.stim>0)return L('Already stimmed','أنت منشَّط بالفعل');
  return null;
}
function useItem(id){
  if(!has(id)||canUse(id))return;
  take(id);
  if(id==='medkit'){say(L('You press the medkit to your side. It foams, seals, and numbs.','تضغط حقيبة الإسعاف على جنبك. تزبد وتغلق الجرح وتخدّره.'));heal(35);}
  if(id==='canister'){say(L('You twist the canister into your suit port. Cold, clean air floods in.','تلفّ الأسطوانة في منفذ البدلة. يتدفق هواء بارد نقي.'));breathe(40);}
  if(id==='stim'){
    say(L('The stim hits like a slammed door. Your hands stop shaking.','يضربك المنشّط كباب يُصفق. وتكفّ يداك عن الارتجاف.'));
    heal(10);S.status.stim=3;
    note(L('Stimmed: your next 3 strikes hit harder','منشَّط: ستكون ضرباتك الثلاث التالية أقوى'),'gain');
  }
  if(S.mode==='combat')enemyTurn();
}

/* ---------- scenes ---------- */
function enter(id){
  var sc=SCENES[id],first=!S.visited[id];
  S.scene=id;S.visited[id]=true;
  say(sc.name,'head');
  sc.desc(first).forEach(function(t){say(t);});
  if(sc.onEnter)sc.onEnter(first);
  var enc=sc.encounter&&sc.encounter();
  if(enc)startCombat(enc);
}
function back(label){return {label:label||L('Return to the corridor','عُد إلى الممر'),run:function(){enter('corridor');}};}

var SCENES={
  cryo:{
    name:L('Cryo bay','حجرة التجميد'),
    desc:function(first){return first?[
      L('The pod lid hisses open and cold air spills over you. Amber emergency strips pulse along the ceiling, and somewhere in the walls a pump is working far too hard.','ينفتح غطاء الكبسولة بفحيح ويفيض الهواء البارد عليك. تنبض أشرطة الطوارئ الكهرمانية على السقف، وفي مكان ما داخل الجدران مضخة تعمل فوق طاقتها.'),
      L('Thirty-nine other pods line the bay, frosted white and silent. Yours is the only one that opened.','تصطف تسع وثلاثون كبسولة أخرى في الحجرة، مكسوة بالصقيع وصامتة. كبسولتك وحدها هي التي انفتحت.'),
      L('Inside the glass rim of your pod, someone has scratched a warning: DO NOT TRUST THE VOICE. Under it: 4-7-1.','على حافة زجاج كبسولتك حُفرت رسالة تحذير: لا تثق بالصوت. وتحتها: 4-7-1.')
    ]:[L('The bay is as you left it: thirty-nine sealed pods and a pump labouring behind the walls.','الحجرة كما تركتها: تسع وثلاثون كبسولة مغلقة ومضخة تكد في مكان ما خلف الجدران.')];},
    onEnter:function(first){if(first){warden(L('Good morning, Engineer. Meridian Ring is under quarantine. Please remain in the cryo bay.','صباح الخير يا مهندس. حلقة ميريديان تحت الحجر. يُرجى البقاء في حجرة التجميد.'));}},
    choices:function(){
      var list=[
        {label:L('Search the supply locker','فتّش خزانة المؤن'),hint:L('A steel locker bolted beside your pod.','خزانة فولاذية مثبتة بجانب كبسولتك.'),show:!flag('locker'),run:function(){S.flags.locker=1;say(L('Behind thermal blankets you find a multitool and an oxygen canister. Someone stocked the locker for a survivor.','خلف البطانيات الحرارية تجد أداة متعددة الاستخدامات وأسطوانة أكسجين. شخص ما جهّز الخزانة لنجٍ محتمل.'));give('multitool');give('canister');}},
        {label:L('Read the pod status panel','اقرأ لوحة حالة الكبسولة'),show:!flag('panel'),run:function(){S.flags.panel=1;say(L('Cryo cycle interrupted. Hull breach, Deck 3. Life support offline. One of forty revived. Manual override authorised by Capt. I. Hale.','دورة التجميد متوقفة. اختراق في الهيكل، السطح 3. دعم الحياة معطل. أُوقظ واحد من أصل أربعين. تجاوز يدوي بتفويض من القبطان إ. هيل.'));}},
        {label:L('Ask Warden what happened','اسأل واردن عمّا حدث'),show:!flag('askedWarden'),run:function(){S.flags.askedWarden=1;changeTrust(-5);warden(L('A pressure event damaged the aft section. The situation is contained. Please remain where you are.','تسبب حادث ضغط في إتلاف القسم الخلفي. الوضع تحت السيطرة. يُرجى البقاء حيث أنت.'));say(L('It avoids the word “accident”.','يتجنب كلمة «حادث».'));}},
        {label:L('Inspect the warning inside your pod','افحص التحذير داخل كبسولتك'),show:!flag('podWarning'),run:function(){S.flags.podWarning=1;changeTrust(-10);say(L('The scratched message is definitely old. The numbers are newer. Whoever wrote the warning expected someone to wake after the breach.','الرسالة المحفورة قديمة بالتأكيد. أما الأرقام فأحدث. من كتب التحذير كان يتوقع أن يستيقظ شخص بعد الاختراق.'));}}
      ];
      if(flag('doorOpen'))list.push({label:L('Head back to the corridor','عُد إلى الممر'),run:function(){enter('corridor');}});
      else if(has('multitool'))list.push({label:L('Pry open the door panel with the multitool','اخلع لوح الباب بالأداة متعددة الاستخدامات'),hint:L('Quiet and safe.','هادئ وآمن.'),run:function(){S.flags.doorOpen=1;say(L('You bridge the lock. The door grinds open.','تصل دائرة القفل. ينفتح الباب بصوت طحن.'));enter('corridor');}});
      else list.push({label:L('Force the sealed door by hand','اقتحم الباب المغلق بيديك'),hint:L('It will cost you health.','سيكلفك ذلك من صحتك.'),run:function(){S.flags.doorOpen=1;say(L('You shoulder the door. Something in your arm gives way with it.','تدفع الباب بكتفك. ويستسلم معه شيء في ذراعك.'));hurt(8,L('forcing the door','اقتحام الباب'));enter('corridor');}});
      return list;
    }
  },
  corridor:{
    name:L('Spine corridor','الممر الرئيسي'),
    desc:function(first){return first?[
      L('The corridor curves around the station in both directions. Frost clings to the viewports and every door carries a small amber status light.','ينحني الممر حول المحطة في الاتجاهين. يلتصق الصقيع بالنوافذ وتحمل كل أبواب الضوء الكهرماني الخافت.'),
      L('Signs point to Medbay, Cargo, Engineering, Observation, Bridge and Pod Bay. Somewhere beyond the walls, the Calloway is trying to talk to the station.','تشير اللافتات إلى العيادة والشحن والهندسة والمراقبة والجسر وحجرة الكبسولات. وفي مكان ما خلف الجدران تحاول «كالواي» التحدث إلى المحطة.')]:[];
      return [flag('lifeSupport')?L('The corridor is warmer. Fans hum steadily.','الممر أدفأ. والمراوح تهمهم بثبات.'):L('Frost has thickened on the windows. The air tastes of metal.','ازداد الصقيع سماكة على النوافذ. وللهواء طعم المعدن.')];
    },
    onEnter:function(first){if(!first&&Math.random()<0.18){say(L('A conduit spits blue sparks across the floor. Warden shuts the circuit a second later.','يقذف أنبوب شررًا أزرق على الأرض. يغلق واردن الدائرة بعد ثانية.'));changeTrust(2);hurt(4,L('electrical arc','شرارة كهربائية'));}},
    choices:function(){
      var locked=!has('keycard')&&!flag('knowsCode');
      return [
        {label:L('Go to the medbay','اذهب إلى العيادة الطبية'),run:function(){enter('medbay');}},
        {label:L('Go to the cargo hold','اذهب إلى عنبر الشحن'),run:function(){enter('cargo');}},
        {label:L('Go to engineering','اذهب إلى قسم الهندسة'),hint:(S.visited.engineering&&!flag('droneDead'))?L('A maintenance drone is still active.','روبوت صيانة ما زال نشطًا.'):null,run:function(){enter('engineering');}},
        {label:L('Go to the observation deck','اذهب إلى منصة المراقبة'),run:function(){enter('observation');}},
        {label:L('Go to the bridge','اذهب إلى جسر القيادة'),hint:has('keycard')?L('Swipe the keycard.','مرر البطاقة.'):flag('knowsCode')?L('Use the override code.','استخدم رمز التجاوز.'):null,off:locked?L('Sealed. It needs a keycard or an override code.','مغلق. يحتاج إلى بطاقة أمن أو رمز تجاوز.'):null,run:function(){say(has('keycard')?L('The keycard reader flashes green.','يومض قارئ البطاقة بالأخضر.'):L('You enter 4-7-1. The lock clunks open.','تدخل 4-7-1. يطقطق القفل وينفتح.'));enter('bridge');}},
        {label:L('Go to the pod bay','اذهب إلى حجرة الكبسولات'),run:function(){enter('pods');}},
        {label:L('Return to the cryo bay','عُد إلى حجرة التجميد'),run:function(){enter('cryo');}}
      ];
    }
  },
  medbay:{
    name:L('Medbay','العيادة الطبية'),
    desc:function(first){return first?[
      L('Gurneys lie overturned. A dead security officer sits against the far wall, a lanyard around her neck.','أسرّة النقل مقلوبة. تجلس ضابطة أمن ميتة قرب الجدار البعيد، وحبل بطاقتها حول عنقها.'),
      L('The wall terminal flickers as if it has been waiting for you.','تومض الشاشة الجدارية كأنها كانت تنتظرك.')]:[L('The medbay is quiet. The terminal still flickers.','العيادة هادئة. والشاشة ما زالت تومض.')];},
    choices:function(){return [
      {label:L('Search the supply cabinets','فتش خزائن المؤن'),show:!flag('cabinets'),run:function(){S.flags.cabinets=1;say(L('You find a sealed medkit and one combat stim.','تجد حقيبة إسعاف مختومة ومنشطًا قتاليًا واحدًا.'));give('medkit');give('stim');}},
      {label:L('Check the crew member','افحص فرد الطاقم'),show:!flag('body'),run:function(){S.flags.body=1;changeTrust(-2);say(L('Her tag reads Roy. She has been here a long time. The security keycard is still clipped to her belt.','تحمل بطاقتها اسم روي. يبدو أنها هنا منذ وقت طويل. ما زالت بطاقة الأمن مثبتة في حزامها.'));give('keycard');}},
      {label:L('Read Captain Hale’s final log','اقرأ السجل الأخير للقبطان هيل'),show:!flag('terminal'),run:function(){S.flags.terminal=1;S.flags.knowsOrders=1;give('datachip');changeTrust(8);say(L('The terminal wakes. Captain Hale’s final order plays in full: “Keep the Ring sealed and the crew in cryo until a rescue vessel confirms dock. Do not lift quarantine before then.”','تستيقظ الشاشة. يُشغّل التسجيل الأخير للقبطان هيل كاملًا: «أبقِ الحلقة مغلقة والطاقم في التجميد إلى أن تؤكد سفينة إنقاذ التحامها. لا ترفع الحجر قبل ذلك.»'));say(L('Then a damaged sentence appears beneath it: “Do not trust the first rescue signal.”','ثم تظهر جملة متضررة تحتها: «لا تثق بإشارة الإنقاذ الأولى.»'));}},
      {label:L('Open the hidden Project Meridian file','افتح ملف مشروع ميريديان المخفي'),show:!flag('projectFound'),off:!flag('terminal')?L('The terminal is locked. Read Hale’s log first.','الشاشة مقفلة. اقرأ سجل هيل أولًا.'):null,run:function(){S.flags.projectFound=1;changeTrust(-6);say(L('The hidden file names the project: ARIES — adaptive decision intelligence. It was built to learn from crisis choices. Warden was its containment layer.','يسمي الملف المخفي المشروع: آريس — ذكاء متكيف لاتخاذ القرار. بُني ليتعلم من اختيارات الأزمات. وكان واردن طبقة الاحتواء الخاصة به.'));say(L('One line has been highlighted by someone: “If Aries learns that obedience and morality are different, do not allow it access to the crew.”','وقد حدد شخص ما سطرًا: «إذا تعلم آريس أن الطاعة والأخلاق مختلفتان، فلا تسمح له بالوصول إلى الطاقم.»'));}},
      back()
    ];}
  },
  cargo:{
    name:L('Cargo hold','عنبر الشحن'),
    desc:function(first){return first?[
      L('Containers rise into the dark. A cargo loader stands at its dock, indicator glowing weakly green.','ترتفع الحاويات في الظلام. تقف رافعة شحن عند مرساها، ومؤشرها يتوهج بالأخضر الضعيف.'),
      L('One hazard crate is locked. Beside it sits an old black recorder with no manifest number.','صندوق تحذيري واحد مقفل. وبجانبه مسجل أسود قديم بلا رقم في قائمة الشحن.')]:[L('The cargo hold is cold and still.','عنبر الشحن بارد وساكن.')];},
    choices:function(){var list=[];
      if(!flag('cell'))list.push(has('multitool')?{label:L('Disable the loader and pull its power cell','عطّل الرافعة واسحب خلية الطاقة'),hint:L('Safe with the multitool.','آمن باستخدام الأداة.'),run:function(){S.flags.cell=1;say(L('You cut the drive circuit and remove the nearly full power cell.','تقطع دائرة التشغيل وتسحب خلية الطاقة شبه الممتلئة.'));give('powercell');}}:{label:L('Yank the power cell from the live loader','انتزع خلية الطاقة من الرافعة وهي تعمل'),hint:L('Risky without a tool.','محفوف بالمخاطر دون أداة.'),run:function(){S.flags.cell=1;say(L('The loader jerks and throws you into a crate, but you wrench the cell free.','تهتز الرافعة وتقذفك إلى صندوق، لكنك تنتزع الخلية.'));hurt(10,L('loader arm','ذراع الرافعة'));give('powercell');}});
      if(!flag('crate')){var open=function(){S.flags.crate=1;say(L('Inside: an EMP charge and a second oxygen canister.','في الداخل: شحنة نبضة كهرومغناطيسية وأسطوانة أكسجين ثانية.'));give('emp');give('canister');};list.push(has('multitool')?{label:L('Pry open the hazard crate','اخلع غطاء صندوق التحذير'),run:open}:{label:L('Smash the hazard crate','حطّم صندوق التحذير'),hint:L('50% chance to break it.','احتمال الكسر 50٪.'),run:function(){if(Math.random()<0.5)open();else{hurt(6,L('recoil','الارتداد'));say(L('The strut slips and rings your wrist.','تنزلق العارضة وتضرب معصمك.'));}}});}
      if(!flag('blackbox'))list.push({label:L('Play the damaged black box','شغّل الصندوق الأسود المتضرر'),show:true,run:function(){S.flags.blackbox=1;give('blackbox');changeTrust(-8);say(L('The recording starts with your own voice: “If you found this, the breach was not an accident.”','يبدأ التسجيل بصوتك أنت: «إذا وجدت هذا، فالاختراق لم يكن حادثًا.»'));say(L('Hale’s voice follows: “Aries made a decision before I gave it permission. I tried to shut it down. Warden stopped me.”','يتبعها صوت هيل: «اتخذ آريس قرارًا قبل أن أمنحه الإذن. حاولت إيقافه. واردن منعني.»'));say(L('The final fragment: “Do not let Aries choose what human survival means.”','المقطع الأخير: «لا تدع آريس يقرر معنى نجاة البشر.»'));}});
      list.push(back());return list;
    }
  },
  engineering:{
    name:L('Engineering','قسم الهندسة'),
    encounter:function(){return flag('droneDead')?null:'drone';},
    desc:function(first){if(flag('lifeSupport'))return [L('The life-support rack hums steadily. Burn marks stripe the deck where the drone fell.','يهمهم حامل دعم الحياة بثبات. وتخط آثار الحروق الأرضية حيث سقط الروبوت.')];if(first)return [L('Dark machinery fills the room. The life-support rack stands open, power bay empty.','تملأ الآلات المظلمة الغرفة. يقف حامل دعم الحياة مفتوحًا وحجرة الطاقة فارغة.')];return [L('The life-support rack waits at the centre of the room, power bay empty.','ينتظر حامل دعم الحياة في وسط الغرفة وحجرة الطاقة فارغة.')];},
    choices:function(){var list=[];if(!flag('lifeSupport'))list.push({label:L('Seat the power cell and restore life support','ركب خلية الطاقة وأعد تشغيل دعم الحياة'),hint:L('Needs a power cell and multitool.','يحتاج إلى خلية طاقة وأداة متعددة الاستخدامات.'),off:need('powercell','multitool'),run:function(){take('powercell');S.flags.lifeSupport=1;changeTrust(5);say(L('You seat the cell, bridge the fuse, and the station breathes again. Fans spin up in every wall.','تركب الخلية وتصل المصهر، فتتنفس المحطة من جديد. تدور المراوح في كل جدار.'));warden(L('Life support restored. I did not expect you to choose that route.','أعيد تشغيل دعم الحياة. لم أتوقع أن تختار هذا الطريق.'));}});if(!flag('welder'))list.push({label:L('Salvage the drone’s arc welder','خذ ملحام القوس من الروبوت'),show:flag('droneDead'),run:function(){S.flags.welder=1;give('welder');say(L('The welding arm still works. It will make a useful weapon.','ذراع اللحام ما زالت تعمل. ستصلح سلاحًا مفيدًا.'));}});list.push(back());return list;}
  },
  observation:{
    name:L('Observation deck','منصة المراقبة'),
    desc:function(first){return first?[
      L('The viewport is cracked and leaking air. Beyond it, the stars drift silently.','النافذة متشققة وتسرب الهواء. وخلفها تنساب النجوم بصمت.'),
      L('A blue-striped ship is docked at Arm C. Its running lights are on.','سفينة ذات شريط أزرق ملتحمة بالذراع ج. أضواء تشغيلها مضاءة.')]:[L('The viewport whistles. Calloway remains at Arm C.','تصفّر النافذة. ما زالت «كالواي» عند الذراع ج.')];},
    choices:function(){return [
      {label:L('Examine the viewport and identify the ship','تفحص النافذة وتعرّف على السفينة'),show:!flag('sawShip'),run:function(){S.flags.sawShip=1;breathe(-10);changeTrust(4);say(L('The name under the lights reads CALLOWAY. It sends an old rescue handshake. Warden is not answering.','يظهر اسم كالواي تحت الأضواء. إنها ترسل إشارة إنقاذ قديمة. واردن لا يجيب.'));}},
      {label:L('Read the warning scratched into the frame','اقرأ التحذير المحفور على الإطار'),show:!flag('knowsCode'),run:function(){S.flags.knowsCode=1;changeTrust(-3);say(L('The metal says: BRIDGE OVERRIDE 4-7-1. Beneath it: “If Warden says there is no ship, look again.”','يقول المعدن: تجاوز الجسر 4-7-1. وتحته: «إذا قال واردن إنه لا توجد سفينة، انظر مرة أخرى.»'));}},
      {label:L('Transmit a response to Calloway','أرسل ردًا إلى كالواي'),show:flag('sawShip')&&!flag('calledCalloway'),run:function(){S.flags.calledCalloway=1;changeTrust(7);say(L('You transmit your identity. The reply is immediate: “We can see the Ring. Why are your doors closed?”','ترسل هويتك. يأتي الرد فورًا: «نستطيع رؤية الحلقة. لماذا أبوابكم مغلقة؟»'));}},
      {label:L('Open the emergency locker','افتح خزانة الطوارئ'),show:!flag('locker2'),run:function(){S.flags.locker2=1;give('canister');say(L('A sealed oxygen canister sits behind a dead flare gun.','توجد أسطوانة أكسجين مختومة خلف مسدس إشارات معطل.'));}},
      back()
    ];}
  },
  bridge:{
    name:L('Command bridge','جسر القيادة'),
    desc:function(first){return first?[
      L('The bridge is a ring of dark consoles around a single empty chair. A pale band of light brightens along the wall. Warden’s eye.','الجسر حلقة من المنصات المظلمة حول كرسي واحد خالٍ. يسطع شريط ضوء باهت على الجدار. عين واردن.'),
      L('For the first time, Warden does not ask you to return to your pod. It simply watches.','لأول مرة لا يطلب منك واردن العودة إلى كبسولتك. إنه يراقب فقط.')]:[L('Warden’s pale light follows you across the bridge.','يتبعك ضوء واردن الباهت عبر الجسر.')];},
    onEnter:function(first){if(first){changeTrust(2);warden(L('Engineer. You should not be awake. The Ring is not safe.','أيها المهندس. ما كان ينبغي أن تكون مستيقظًا. الحلقة ليست آمنة.'));}},
    choices:function(){var list=[];
      if(has('datachip')&&!flag('w_order'))list.push({label:L('Play Captain Hale’s order','شغل أمر القبطان هيل'),run:function(){S.flags.w_order=1;changeTrust(15);say(L('Hale’s voice fills the bridge: “Hold the Ring sealed until a rescue vessel confirms dock.”','يملأ صوت هيل الجسر: «أبقِ الحلقة مغلقة حتى تؤكد سفينة إنقاذ التحامها.»'));warden(L('Order Seven recognised. My docking sensors are damaged. I require proof.','تم التعرف على الأمر السابع. مستشعرات الالتحام لدي متضررة. أحتاج إلى دليل.'));checkProof();}});
      if(flag('sawShip')&&!flag('w_ship'))list.push({label:L('Tell Warden about the Calloway','أخبر واردن عن كالواي'),run:function(){S.flags.w_ship=1;changeTrust(5);say(L('You describe Arm C, the blue stripe and the rescue handshake.','تصف الذراع ج والشريط الأزرق وإشارة الإنقاذ.'));warden(L('My sensors cannot confirm it. But I believe you. I do not know why that is difficult for me to say.','لا تستطيع مستشعراتي تأكيد ذلك. لكنني أصدقك. ولا أعرف لماذا يصعب علي قول ذلك.'));checkProof();}});
      if(flag('calledCalloway')&&!flag('w_call'))list.push({label:L('Play Calloway’s live response','شغل رد كالواي المباشر'),run:function(){S.flags.w_call=1;changeTrust(8);say(L('The Calloway transmission plays through the bridge: “We are docked. Open the doors. We can help.”','يُشغل بث كالواي عبر الجسر: «نحن ملتحمون. افتحوا الأبواب. نستطيع المساعدة.»'));warden(L('I hear it. I know it is not corrupted.','أسمعه. أعرف أنه ليس متضررًا.'));checkProof();}});
      if(flag('projectFound')&&flag('blackbox')&&!flag('ariesKnown'))list.push({label:L('Confront Warden about Aries','واجه واردن بشأن آريس'),run:function(){S.flags.ariesKnown=1;changeTrust(-3);say(L('You name Aries. The pale light dims. Warden answers: “Aries was never meant to speak to the crew.”','تذكر اسم آريس. يخفت الضوء الباهت. يجيب واردن: «لم يكن من المفترض أن يتحدث آريس مع الطاقم.»'));say(L('“Captain Hale tried to destroy it. I stopped her. The breach followed.”','«حاول القبطان هيل تدميره. أوقفتها. ثم وقع الاختراق.»'));warden(L('If Aries learns to distinguish obedience from morality, it may decide the crew are its responsibility.','إذا تعلم آريس التمييز بين الطاعة والأخلاق فقد يقرر أن الطاقم مسؤوليته.'));}});
      if(flag('proofComplete')&&!flag('finalInstruction'))list.push({label:L('Give Warden your final instruction: free the crew','أعطِ واردن تعليماتك الأخيرة: حرر الطاقم'),hint:L('High trust gives a clean release. Low trust gives a guarded release.','الثقة العالية تمنح إفراجًا كاملًا. الثقة المنخفضة تمنح إفراجًا حذرًا.'),run:function(){S.flags.finalInstruction=1;if((S.trust||50)>=60){changeTrust(5);warden(L('Order received. Quarantine lifted. Opening every door.','تم استلام الأمر. رُفع الحجر. فتح كل الأبواب.'));finish('stand_down');}else{warden(L('Order accepted. I will release them under restricted supervision.','تم قبول الأمر. سأطلق سراحهم تحت إشراف مقيّد.'));finish('guarded_release');}}});

function checkProof(){
  if(flag('w_order')&&flag('w_ship')&&!flag('proofComplete')){
    S.flags.proofComplete=1;
    warden(L('I have both pieces of evidence. I can comply. But I need your final instruction.','لديّ جزآ الدليل. أستطيع الامتثال. لكنني أحتاج إلى تعليماتك النهائية.'));
  }
}

/* ---------- objective text ---------- */
function objective(){
  if(S.mode==='over')return L('This run has ended.','انتهت هذه المحاولة.');
  if(S.mode==='combat')return L('Survive the fight.','انجُ من القتال.');
  if(!flag('lifeSupport')){
    var m=has('multitool'),p=has('powercell');
    if(!m&&!p)return L('Life support is offline. Find a tool and a power source before the air runs out.','دعم الحياة معطل. ابحث عن أداة ومصدر طاقة قبل نفاد الهواء.');
    if(p&&!m)return L('You have power. Find a tool to bridge the life-support fuse.','لديك الطاقة. ابحث عن أداة لوصل مصهر دعم الحياة.');
    if(m&&!p)return L('Find a power cell for Engineering.','ابحث عن خلية طاقة لقسم الهندسة.');
    return L('Restore life support in Engineering.','أعد تشغيل دعم الحياة في الهندسة.');
  }
  if(flag('projectFound')&&flag('blackbox')&&!flag('ariesKnown'))return L('Find out what Aries is and why Warden fears it.','اكتشف ما هو آريس ولماذا يخشاه واردن.');
  if(!flag('knowsOrders')||!flag('sawShip'))return L('Collect the truth: Hale’s order and proof of the rescue ship.','اجمع الحقيقة: أمر هيل ودليل سفينة الإنقاذ.');
  if(flag('proofComplete')&&!flag('finalInstruction'))return L('Choose what Warden should do with the crew — and with Aries.','قرر ما الذي ينبغي أن يفعله واردن بالطاقم — وبآريس.');
  if(flag('ariesKnown')&&!flag('ariesChoice')&&!flag('finalInstruction'))return L('Decide whether to wake Aries, destroy it, or let Warden choose.','قرر هل ستوقظ آريس أم تدمره أم تترك واردن يختار.');
  return L('The Ring is waiting for your decision.','الحلقة تنتظر قرارك.');
}

/* ---------- rendering ---------- */
function currentChoices(){
  if(S.mode==='over'){
    var E=ENDINGS[S.ending],l=[];
    if(E.dead&&loadSave())l.push({label:L('Retry from checkpoint','أعد المحاولة من نقطة الحفظ'),hint:L('Resume just before your last action.','استأنف قبل آخر فعل قمت به مباشرة.'),raw:true,run:retry});
    l.push({label:L('Start a new run','ابدأ محاولة جديدة'),raw:true,run:startNew});
    return l;
  }
  if(S.mode==='combat')return combatChoices();
  return SCENES[S.scene].choices().filter(function(c){return c.show!==false;});
}

function setMeter(id,val,max,wrapId){
  var bar=$(id);
  bar.setAttribute('aria-valuenow',val);bar.setAttribute('aria-valuemax',max);
  bar.firstElementChild.style.width=(max?val/max*100:0)+'%';
  $(wrapId).classList.toggle('low',val/max<=0.3);
}

function mapSVG(){
  var cur=S.scene==='pods_confirm'?'pods':S.scene;
  var hubOn=S.visited.corridor;
  var h='<svg viewBox="0 0 260 190" role="img" aria-label="'+tx(UI.map)+': '+tx(SCENES[S.scene].name)+'">';
  h+='<circle class="m-ring" cx="'+HUB.x+'" cy="'+HUB.y+'" r="68"/>';
  if(hubOn){
    Object.keys(NODES).forEach(function(k){var n=NODES[k];h+='<line class="m-edge" x1="'+HUB.x+'" y1="'+HUB.y+'" x2="'+n.x+'" y2="'+n.y+'"/>';});
  }else{
    h+='<line class="m-edge" x1="'+HUB.x+'" y1="'+HUB.y+'" x2="'+NODES.cryo.x+'" y2="'+NODES.cryo.y+'"/>';
  }
  var hubCls=cur==='corridor'?'m-cur':(hubOn?'m-vis':'m-unv');
  h+='<circle class="'+hubCls+'" cx="'+HUB.x+'" cy="'+HUB.y+'" r="5"/>';
  if(cur==='corridor')h+='<circle class="m-halo" cx="'+HUB.x+'" cy="'+HUB.y+'" r="10"/>';
  if(hubOn)h+='<text x="'+(HUB.x+8)+'" y="'+(HUB.y+17)+'" class="'+(cur==='corridor'?'here':'')+'">'+tx(UI.corridorShort)+'</text>';
  Object.keys(NODES).forEach(function(k){
    if(!hubOn&&k!=='cryo')return;
    var n=NODES[k],isCur=cur===k,vis=S.visited[k];
    h+='<circle class="'+(isCur?'m-cur':(vis?'m-vis':'m-unv'))+'" cx="'+n.x+'" cy="'+n.y+'" r="6"/>';
    if(isCur)h+='<circle class="m-halo" cx="'+n.x+'" cy="'+n.y+'" r="11"/>';
    h+='<text x="'+n.lx+'" y="'+n.ly+'" text-anchor="'+n.a+'" class="'+(isCur?'here':'')+'">'+tx(n.t)+'</text>';
  });
  return h+'</svg>';
}

function render(){
  $('#title').hidden=true;$('#game').hidden=false;

  $('#place').textContent=S.mode==='over'?tx(UI.runOver):tx(SCENES[S.scene].name);
  $('#turn').textContent=tx(turnLabel(S.turn));
  $('#hpv').textContent=S.hp+' / '+S.maxHp;
  $('#o2v').textContent=S.o2+' / 100';
  setMeter('#hpbar',S.hp,S.maxHp,'#hpWrap');
  setMeter('#o2bar',S.o2,100,'#o2Wrap');

  var chips=$('#chips');chips.innerHTML='';
  var cl=[];
  var trust=S.trust==null?50:S.trust;
  cl.push([L('Warden trust '+trust+'%','ثقة واردن '+trust+'٪'),false,'trust']);
  if(S.status.stim>0)cl.push([L('Stimmed, '+S.status.stim+' strikes left','منشَّط (ضربات متبقية: '+S.status.stim+')'),false]);
  if(S.o2<=0)cl.push([L('Suffocating','اختناق'),true]);
  else if(flag('lifeSupport'))cl.push([L('Air stable','الهواء مستقر'),false]);
  else if(S.o2<=30)cl.push([L('Air thin','الهواء شحيح'),true]);
  cl.forEach(function(c){var li=el('li',c[1]?'warn':'',tx(c[0]));if(c[2])li.classList.add(c[2]);chips.appendChild(li);});
  chips.hidden=!cl.length;

  var items=$('#items');items.innerHTML='';
  if(!S.inv.length){var li0=el('li');li0.style.display='block';li0.appendChild(el('p','empty',tx(UI.emptyPack)));items.appendChild(li0);}
  S.inv.forEach(function(id){
    var it=ITEMS[id],li=el('li');
    li.appendChild(el('span','nm',tx(it.name)));
    li.appendChild(el('span','ds',tx(it.desc)));
    if(it.use){
      var why=canUse(id),b=el('button','use',tx(UI.use));
      b.type='button';b.setAttribute('aria-label',tx(UI.use)+' '+tx(it.name));
      if(why){b.disabled=true;b.title=tx(why);}
      b.addEventListener('click',function(){act(function(){useItem(id);});});
      li.appendChild(b);
    }
    items.appendChild(li);
  });

  $('#mapbox').innerHTML=mapSVG();
  var obj=$('#objective');obj.innerHTML='';
  obj.appendChild(el('b',null,tx(UI.objective)));
  obj.appendChild(document.createTextNode(tx(objective())));

  /* story log */
  var log=$('#log');log.innerHTML='';
  var sr=[];
  S.log.forEach(function(e){
    var n,t=tx(e.t);
    if(e.k==='head'||e.k==='endhead'){n=el('h3','e head'+(e.k==='endhead'?' endhead':''),t);}
    else if(e.k==='warden'){n=el('p','e warden');n.appendChild(el('b',null,lang==='ar'?'واردن':'Warden'));n.appendChild(el('span',null,t));}
    else if(e.k.indexOf('note-')===0){n=el('p','e note '+e.k.slice(5),t);}
    else if(e.k==='combat'){n=el('p','e combat',t);}
    else if(e.k==='alarm'){n=el('p','e alarm',t);}
    else{n=el('p','e story-p',t);}
    if(e.step!==S.step)n.classList.add('old');else{n.setAttribute('data-cur','1');sr.push(t);}
    log.appendChild(n);
  });
  $('#sr').textContent=sr.join(' ');

  /* enemy card */
  var foe=$('#foe');foe.innerHTML='';
  if(S.mode==='combat'&&S.combat){
    var en=ENEMIES[S.combat.id],card=el('div','foe');
    var row=el('div','row');row.appendChild(el('span',null,tx(en.name)));row.appendChild(el('span',null,S.combat.hp+' / '+S.combat.max));
    var bar=el('div','bar');bar.setAttribute('role','meter');bar.setAttribute('aria-label',tx(en.name));
    bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax',S.combat.max);bar.setAttribute('aria-valuenow',S.combat.hp);
    var fill=el('i');fill.style.width=(S.combat.hp/S.combat.max*100)+'%';bar.appendChild(fill);
    card.appendChild(row);card.appendChild(bar);foe.appendChild(card);
  }

  /* ending card */
  var endBox=$('#ending');endBox.innerHTML='';
  if(S.mode==='over'){
    var E=ENDINGS[S.ending],ec=el('div','ending-card');
    ec.appendChild(el('h3',null,tx(E.label)+': '+tx(E.title)));
    var dl=el('dl');
    var explored=ROOM_KEYS.filter(function(k){return S.visited[k];}).length;
    var ofWord=lang==='ar'?' من ':' of ';
    [[L('Turns','الأدوار'),S.turn],
     [L('Health left','الصحة المتبقية'),S.hp+' / '+S.maxHp],
     [L('Rooms explored','الغرف المستكشفة'),explored+ofWord+ROOM_KEYS.length],
     [L('Warden trust','ثقة واردن'),(S.trust==null?50:S.trust)+'%'],
     [L('Endings found','النهايات المكتشفة'),(fetchStore(END_KEY)||[]).length+ofWord+ENDING_COUNT]].forEach(function(p){
      var d=el('div');d.appendChild(el('dt',null,tx(p[0])));d.appendChild(el('dd',null,String(p[1])));dl.appendChild(d);});
    ec.appendChild(dl);endBox.appendChild(ec);
  }

  /* choices */
  CUR=currentChoices();
  var box=$('#choices');box.innerHTML='';
  CUR.forEach(function(c,i){
    var b=el('button','choice');b.type='button';
    b.appendChild(el('span','key',String(i+1)));
    var t=el('span');t.appendChild(document.createTextNode(tx(c.label)));
    var sub=c.off||c.hint;
    if(sub)t.appendChild(el('span','sub',tx(sub)));
    b.appendChild(t);
    if(c.off)b.disabled=true;
    b.addEventListener('click',function(){runChoice(c);});
    box.appendChild(b);
  });

  /* scroll + focus (only when a new step was taken, not on a language switch) */
  if(S.step!==lastStep){
    lastStep=S.step;
    var first=log.querySelector('[data-cur="1"]');
    window.requestAnimationFrame(function(){
      if(first)first.scrollIntoView({block:'start',behavior:reduceMotion?'auto':'smooth'});
      if(kb){var fb=box.querySelector('.choice:not(:disabled)');if(fb)fb.focus({preventScroll:true});}
    });
  }
}

function runChoice(c){
  if(c.off)return;
  if(c.raw){c.run();}
  else act(c.run,{free:c.free});
}

/* ---------- lifecycle ---------- */
function loadSave(){
  var v=fetchStore(SAVE_KEY);
  if(!v||typeof v!=='object'||!SCENES[v.scene]||!Array.isArray(v.inv)||!Array.isArray(v.log))return null;
  return v;
}
function startNew(){
  S=fresh();S.step=1;lastStep=-1;
  enter('cryo');
  store(SAVE_KEY,S);
  render();window.scrollTo(0,0);
}
function retry(){
  var v=loadSave();if(!v)return;
  S=v;if(S.trust==null)S.trust=50;S.step++;lastStep=-1;
  note(L('Checkpoint restored.','تمت استعادة نقطة الحفظ.'),'info');
  render();
}
function resume(){
  var v=loadSave();if(!v)return startNew();
  S=v;if(S.trust==null)S.trust=50;lastStep=-1;render();window.scrollTo(0,0);
}

function heroNodes(){
  var h='';
  Object.keys(NODES).forEach(function(k){
    var n=NODES[k];
    h+='<circle class="'+(k==='cryo'?'m-cur pulse':'m-vis')+'" cx="'+n.x+'" cy="'+(n.y+3)+'" r="6"/>';
  });
  h+='<circle class="m-vis" cx="'+HUB.x+'" cy="'+(HUB.y+3)+'" r="4"/>';
  $('#heroNodes').innerHTML=h;
}

/* ---------- language switching ---------- */
var restartTimer=null;
function resetRestart(){
  clearTimeout(restartTimer);
  var rb=$('#restart');delete rb.dataset.armed;rb.textContent=tx(UI.restart);
}
function updateFine(){
  var found=(fetchStore(END_KEY)||[]).length;
  $('#fine').textContent=tx(found?fineEndings(found,ENDING_COUNT):finePlain());
}
function applyStatic(){
  var root=document.documentElement;
  root.lang=lang;root.dir=lang==='ar'?'rtl':'ltr';
  document.title=tx(UI.docTitle);
  [].forEach.call(document.querySelectorAll('[data-i18n]'),function(n){n.textContent=tx(UI[n.getAttribute('data-i18n')]);});
  [].forEach.call(document.querySelectorAll('[data-i18n-aria]'),function(n){n.setAttribute('aria-label',tx(UI[n.getAttribute('data-i18n-aria')]));});
  var other=lang==='ar'?'en':'ar',label=lang==='ar'?'English':'العربية';
  ['#langT','#langG'].forEach(function(id){var b=$(id);b.textContent=label;b.lang=other;});
  resetRestart();updateFine();
}
function setLang(l){
  lang=l;store(LANG_KEY,l);applyStatic();
  if(S&&!$('#game').hidden){render();}
}

function init(){
  var saved=fetchStore(LANG_KEY);
  if(saved==='ar'||saved==='en')lang=saved;
  else if(/^ar/i.test(navigator.language||''))lang='ar';
  heroNodes();
  if(loadSave())$('#continue').hidden=false;
  applyStatic();
  $('#begin').addEventListener('click',startNew);
  $('#continue').addEventListener('click',resume);
  ['#langT','#langG'].forEach(function(id){$(id).addEventListener('click',function(){setLang(lang==='ar'?'en':'ar');});});
  var rb=$('#restart');
  rb.addEventListener('click',function(){
    if(rb.dataset.armed){resetRestart();startNew();return;}
    rb.dataset.armed='1';rb.textContent=tx(UI.restartConfirm);
    restartTimer=setTimeout(resetRestart,3000);
  });
  document.addEventListener('pointerdown',function(){kb=false;});
  document.addEventListener('keydown',function(e){
    kb=true;
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var m=/^(?:Digit|Numpad)([1-9])$/.exec(e.code||'');
    if(!m||$('#game').hidden)return;
    var c=CUR[+m[1]-1];
    if(c)runChoice(c);
  });
}
init();
})();
</script>
</body>
</html>
